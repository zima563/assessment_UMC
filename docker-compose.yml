version: '3.8'

services:
  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: ems_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: employee_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Node.js TypeORM Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_backend_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: employee_db
      JWT_SECRET: super_secret_jwt_key_employee_management_2026
      JWT_EXPIRES_IN: 1d
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # React Vite Frontend SPA Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems_frontend_ui
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
