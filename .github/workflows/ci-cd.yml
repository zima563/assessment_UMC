name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Verification Job
  backend-checks:
    name: Backend Type-check & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Type-check and Build Backend
        run: |
          cd backend
          npm run build

  # 2. Frontend Verification Job
  frontend-checks:
    name: Frontend Type-check & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Type-check and Build Frontend
        run: |
          cd frontend
          npm run build

  # 3. Docker Composition Validation Job
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

  # 4. Continuous Deployment to AWS EC2 Job
  deploy-to-aws:
    name: Continuous Deployment to AWS EC2
    needs: [backend-checks, frontend-checks, docker-validation]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            # Ensure Docker & Docker Compose are installed on AWS EC2
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
            fi

            # Navigate to project folder or clone repository on first deployment
            if [ ! -d "/home/ubuntu/assessment_UMC" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git /home/ubuntu/assessment_UMC
            fi
            
            cd /home/ubuntu/assessment_UMC
            
            # Pull latest code changes
            echo "Pulling latest code from main branch..."
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            # Rebuild and restart all production Docker containers
            echo "Building and launching Docker containers..."
            docker compose up -d --build

            # Execute database seed script automatically inside backend container
            echo "Seeding database accounts..."
            docker exec -i ems_backend_api npm run seed || true
            
            echo "✅ Continuous Deployment to AWS EC2 Completed Successfully!"
